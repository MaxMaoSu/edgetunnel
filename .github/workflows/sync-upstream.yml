name: Sync Upstream and Restore Worker Name

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *"  # 每天凌晨 2 点自动同步
  workflow_dispatch:  # 允许手动触发

jobs:
  sync_and_restore:
    name: Sync from upstream and restore worker name
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          upstream_sync_repo: cmliu/edgetunnel
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Restore worker name and enable cache
        if: steps.sync.outputs.has_new_commits == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PYEOF'
import re

with open('wrangler.toml', 'r', encoding='utf-8') as f:
    content = f.read()

# 1) 恢复 worker 名称
content = re.sub(r'^name\s*=.*$', 'name = "test"', content, count=1, flags=re.M)

# 2) 确保 [cache] enabled = true 存在(若已存在则保持/修正,不存在则追加)
if '[cache]' not in content:
    content += '\n[cache]\nenabled = true\n'
else:
    content = re.sub(r'(?ms)^\[cache\].*?^(?=\S|\Z)', '[cache]\nenabled = true\n', content, count=1)

with open('wrangler.toml', 'w', encoding='utf-8') as f:
    f.write(content)
PYEOF
          git add wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore worker name 'test' and enable cache after upstream sync"
            git push origin main
          fi

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Sync failed. You may need to manually resolve conflicts."
          exit 1
